name: Feature Request
description: Propose a new feature for EShop Verse
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Please describe the feature you'd like to see.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this feature affect?
      options:
        - Android App
        - Backend API
        - Admin Dashboard
        - Database
        - Documentation
        - CI/CD
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this feature is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional information, mockups, or references.
    validations:
      required: false
