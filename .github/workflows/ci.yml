# CI Workflow — EShop Verse
#
# This is a placeholder CI workflow. It will be expanded as build systems
# are set up for each component.
#
# Current status:
# - Android: Java/XML scaffold exists; product features are not implemented yet
# - Backend: Project not initialized yet
# - Admin: Project not initialized yet
#
# Planned checks (to be implemented when components are ready):
# - Android: Gradle build, lint, unit tests
# - Backend: Composer install, PHPUnit tests, PHP lint
# - Admin: React/TypeScript type-check, tests, production build
# - Documentation: Markdown lint (optional)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify repository structure
        run: |
          echo "Verifying repository structure..."
          test -f AGENTS.md       && echo "✓ AGENTS.md"
          test -f README.md       && echo "✓ README.md"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md"
          test -f LICENSE         && echo "✓ LICENSE"
          test -d android/        && echo "✓ android/"
          test -d backend/        && echo "✓ backend/"
          test -d admin/          && echo "✓ admin/"
          test -d docs/           && echo "✓ docs/"
          echo "Repository structure is valid."

  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Run Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

