<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">EShop Verse — Android, Laravel, React e-commerce platform</title>
  <desc id="desc">A dark editorial banner with the EShop Verse wordmark and a bento grid previewing revenue, orders, catalog, and the Android app.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E120F"/>
      <stop offset="0.55" stop-color="#141A15"/>
      <stop offset="1" stop-color="#1A221B"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#385740" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#385740" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTerracotta" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4A894" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D4A894" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C231C"/>
      <stop offset="1" stop-color="#161C17"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A894"/>
      <stop offset="1" stop-color="#D4A894" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A894" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4A894" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A8C5A4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F5F2EA" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <circle cx="1260" cy="70" r="430" fill="url(#glowGreen)"/>
  <circle cx="220" cy="500" r="360" fill="url(#glowTerracotta)"/>
  <rect x="0" y="498" width="1600" height="2" fill="url(#bottomFade)"/>

  <!-- Eyebrow -->
  <rect x="96" y="119" width="42" height="2" rx="1" fill="#D4A894"/>
  <text x="154" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2" fill="#D4A894">AVERON LABS · PORTFOLIO PLATFORM</text>

  <!-- Wordmark -->
  <text x="92" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="700" letter-spacing="-2.5" fill="#F5F2EA">EShop <tspan fill="#D4A894">Verse</tspan></text>

  <!-- Tagline -->
  <text x="96" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#B4B9AE">A complete, contract-first commerce platform.</text>
  <text x="96" y="334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#8F978B">Native Android · Laravel REST API · React admin dashboard</text>

  <!-- Tech pills -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="96" y="372" width="118" height="38" rx="19" fill="#1B211B" stroke="#2D372F"/>
    <circle cx="118" cy="391" r="4" fill="#3DDC84"/>
    <text x="132" y="396" fill="#D7DCD2">Android</text>

    <rect x="226" y="372" width="114" height="38" rx="19" fill="#1B211B" stroke="#2D372F"/>
    <circle cx="248" cy="391" r="4" fill="#FF2D20"/>
    <text x="262" y="396" fill="#D7DCD2">Laravel</text>

    <rect x="352" y="372" width="102" height="38" rx="19" fill="#1B211B" stroke="#2D372F"/>
    <circle cx="374" cy="391" r="4" fill="#61DAFB"/>
    <text x="388" y="396" fill="#D7DCD2">React</text>

    <rect x="466" y="372" width="112" height="38" rx="19" fill="#1B211B" stroke="#2D372F"/>
    <circle cx="488" cy="391" r="4" fill="#4479A1"/>
    <text x="502" y="396" fill="#D7DCD2">MySQL</text>
  </g>

  <text x="96" y="456" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#6E7268">540+ automated tests · Contract-first API · MIT licensed</text>

  <!-- Bento grid -->
  <g filter="url(#softShadow)">
    <rect x="980" y="100" width="270" height="140" rx="20" fill="url(#card)" stroke="#2D372F"/>
    <rect x="1270" y="100" width="270" height="140" rx="20" fill="url(#card)" stroke="#2D372F"/>
    <rect x="980" y="260" width="270" height="140" rx="20" fill="url(#card)" stroke="#2D372F"/>
    <rect x="1270" y="260" width="270" height="140" rx="20" fill="url(#card)" stroke="#2D372F"/>
  </g>

  <!-- Card: revenue -->
  <text x="1006" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8F978B">REVENUE</text>
  <text x="1006" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#F5F2EA">$24,860</text>
  <text x="1006" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#A8C5A4">↑ 18.2% vs last period</text>
  <g fill="#385740">
    <rect x="1006" y="220" width="12" height="14" rx="3"/>
    <rect x="1026" y="214" width="12" height="20" rx="3"/>
    <rect x="1046" y="217" width="12" height="17" rx="3"/>
    <rect x="1066" y="210" width="12" height="24" rx="3"/>
    <rect x="1086" y="213" width="12" height="21" rx="3"/>
    <rect x="1106" y="206" width="12" height="28" rx="3"/>
    <rect x="1126" y="208" width="12" height="26" rx="3"/>
    <rect x="1146" y="202" width="12" height="32" rx="3" fill="#A8C5A4"/>
  </g>

  <!-- Card: orders -->
  <text x="1296" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8F978B">ORDER PIPELINE</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="1296" y="148" width="218" height="26" rx="13" fill="#1F2A21"/>
    <circle cx="1312" cy="161" r="3.5" fill="#A8C5A4"/>
    <text x="1326" y="165" fill="#D7DCD2">Confirmed</text>
    <text x="1470" y="165" fill="#8F978B">128</text>

    <rect x="1296" y="182" width="218" height="26" rx="13" fill="#1F2A21"/>
    <circle cx="1312" cy="195" r="3.5" fill="#E6BCAC"/>
    <text x="1326" y="199" fill="#D7DCD2">Processing</text>
    <text x="1478" y="199" fill="#8F978B">42</text>

    <rect x="1296" y="216" width="218" height="26" rx="13" fill="#1F2A21"/>
    <circle cx="1312" cy="229" r="3.5" fill="#61DAFB"/>
    <text x="1326" y="233" fill="#D7DCD2">Delivered</text>
    <text x="1478" y="233" fill="#8F978B">86</text>
  </g>

  <!-- Card: catalog -->
  <text x="1006" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8F978B">CATALOG</text>
  <g>
    <rect x="1006" y="306" width="44" height="44" rx="12" fill="#E8DEC7"/>
    <rect x="1018" y="318" width="20" height="20" rx="6" fill="#C7B596"/>
    <rect x="1062" y="312" width="110" height="8" rx="4" fill="#3A453B"/>
    <rect x="1062" y="330" width="72" height="7" rx="3.5" fill="#2D372F"/>

    <rect x="1006" y="360" width="44" height="24" rx="12" fill="#1F2A21"/>
    <text x="1018" y="376" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#A8C5A4">12 items</text>
    <text x="1062" y="377" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8F978B">5 categories · images stored</text>
  </g>

  <!-- Card: customer app -->
  <text x="1296" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8F978B">CUSTOMER APP</text>
  <g>
    <rect x="1296" y="308" width="58" height="78" rx="12" fill="#0F140F" stroke="#3A453B" stroke-width="2"/>
    <rect x="1310" y="320" width="30" height="30" rx="7" fill="#385740"/>
    <rect x="1310" y="356" width="30" height="4" rx="2" fill="#2D372F"/>
    <rect x="1310" y="365" width="20" height="4" rx="2" fill="#2D372F"/>
    <circle cx="1325" cy="378" r="2.5" fill="#A8C5A4"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#D7DCD2">
    <text x="1372" y="326">Java 11</text>
    <text x="1372" y="348">Material 3</text>
    <text x="1372" y="370">MVVM</text>
    <text x="1372" y="392" font-size="11" font-weight="500" fill="#8F978B">API 25+ · XML</text>
  </g>

  <!-- Connector -->
  <path d="M872 250 H948" stroke="#3A453B" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="956" cy="250" r="4" fill="#D4A894"/>
</svg>
